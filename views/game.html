<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Ойын — Oylanayiq</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/app.css?v=6"/>
</head>
<body>
<div id="toast-container"></div>
<div class="game-bar">
  <button class="gbar-back" id="back-btn"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></button>
  <div class="gbar-mid"><div class="gbar-title" id="game-title">Ойын</div><div class="gbar-lvl" id="game-lvl-label">1-деңгей</div></div>
  <div class="gbar-right">
    <div class="gbar-score" title="Монета">&#x1FA99; <span id="hdr-coins-g">0</span></div>
    <div class="gbar-score" title="Ұпай">&#x1F3AF; <span id="game-score">0</span></div>
  </div>
</div>
<div class="game-xp"><div class="game-xp-fill" id="lvl-progress"></div></div>
<div id="game-container">
  <div class="game-loading"><div class="game-loading-ico">&#x23F3;</div><p class="game-loading-txt">Жүктелуде...</p></div>
</div>
<div id="tutorial-modal" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-drag"></div>
    <div class="tut-ico">&#x1F4DA;</div>
    <div class="res-title" id="tutorial-title">Ойын</div>
    <div class="tut-text" id="tutorial-text"></div>
    <button class="btn btn-blue btn-full" id="tutorial-ok">Түсіндім</button>
  </div>
</div>
<div id="result-modal" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-drag"></div>
    <span class="res-emoji" id="result-big-emoji">&#x1F3C6;</span>
    <div class="res-title" id="result-title">Тамаша!</div>
    <div class="res-stars" id="result-stars">
      <span class="res-star" data-i="1">&#x2605;</span>
      <span class="res-star" data-i="2">&#x2605;</span>
      <span class="res-star" data-i="3">&#x2605;</span>
    </div>
    <div class="res-coin">&#x1FA99; +<span id="coins-earned">80</span> монета</div>
    <div class="res-btns stagger-grid">
      <button class="btn btn-blue btn-full btn-lg stagger-item" id="next-lvl-btn">Келесі деңгей &#x2192;</button>
      <button class="btn btn-ghost btn-full stagger-item" id="retry-btn">&#x21BA; Қайтадан</button>
      <button class="btn btn-ghost btn-full stagger-item" id="shop-btn">&#x1F6CD; Дүкенге өту</button>
      <a href="/dashboard" class="btn btn-ghost btn-full btn-muted stagger-item">&#x2190; Басты бетке қайту</a>
    </div>
  </div>
</div>
<script src="/js/core.js?v=6"></script>
<script src="/js/games/nomad.js?v=6"></script>
<script src="/js/games/tamga.js?v=6"></script>
<script src="/js/games/labirint.js?v=6"></script>
<script src="/js/games/qamal.js?v=6"></script>
<script src="/js/games/estek.js?v=6"></script>
<script src="/js/games/altyn.js?v=6"></script>
<script src="/js/games/dialog.js?v=6"></script>
<script src="/js/games/baiterek.js?v=6"></script>
<script src="/js/games/expo.js?v=6"></script>
<script src="/js/games/cyber.js?v=6"></script>
<script src="/js/games/qala.js?v=6"></script>
<script src="/js/games/soztorr.js?v=6"></script>
<script src="/js/game-engine.js?v=6"></script>
</body></html>
